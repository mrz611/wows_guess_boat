<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>战舰二十问 · 自由出题版</title>
<style>
  :root { --bg:#10141b; --card:#1a212c; --line:#2c3646; --fg:#dfe7f0; --sub:#8ba3bd; --acc:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:6px 0 2px; }
  .sub { color:var(--sub); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-top:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; color:var(--fg); background:#26303f; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#06121f; font-weight:600; }
  button.attr { padding:8px 6px; min-width:76px; display:flex; flex-direction:column; align-items:center; gap:1px; }
  button.attr b { font-size:14px; }
  button.attr small { font-size:11px; color:var(--sub); }
  button.attr.on { border-color:var(--acc); background:#1d2c40; }
  input[type=text], input[type=number], select { font:inherit; color:var(--fg); background:#0d1117; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  #attrs { display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:8px; margin-top:8px; }
  .stat { display:flex; gap:18px; flex-wrap:wrap; margin:10px 0; }
  .stat b { font-size:22px; }
  .tag { font-size:12px; color:var(--sub); }
  #log { max-height:280px; overflow:auto; background:#0b0e13; border-radius:8px; padding:10px; font-size:14px; }
  #log div { padding:3px 0; border-bottom:1px dashed #1c2430; }
  .shipcard { line-height:2; } .shipcard b { color:var(--acc); }
  .win { color:#4ade80; font-weight:700; font-size:18px; }
  .lose { color:#f87171; font-weight:700; font-size:18px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; margin-top:8px; }
  .legend span { padding:1px 7px; border-radius:5px; color:#10141b; font-weight:600; }
  details { margin-top:10px; } summary { cursor:pointer; color:var(--sub); }
  #cands { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  #cands span { background:#232d3c; border-radius:6px; padding:2px 8px; font-size:13px; }
</style>
</head>

<div class="wrap">

  <div class="sub">规则：系统想好一艘战舰。你<b>自己设计问题</b>——选属性、填数值，系统回答「大于 / 小于 / 等于」。20 问内锁定并猜中船名即胜。</div>

      </span>
      <button class="primary" id="startBtn">开始</button>
    </div>
  </div>

  <div class="card" id="game" style="display:none">
    <div class="stat">
      <div><div class="tag">剩余候选</div><b id="left">742</b></div>
      <div><div class="tag">已用问题</div><b id="used">0 / 20</b></div>
      <div><div class="tag">信息论下限</div><b id="floor">10</b></div>
    </div>

    <div class="tag">① 选属性（按钮上实时显示当前已锁定的取值区间）：</div>
    <div id="attrs"></div>

    <div class="row" style="margin-top:10px">
      <span id="qAttr" style="min-width:96px;color:var(--acc)">血量</span>
      <input type="number" id="qVal" placeholder="输入数值…" style="flex:1;min-width:140px">
      <span id="qUnit" class="tag"></span>
      <button class="primary" id="askBtn">提问！</button>
    </div>

    <div class="row" style="margin-top:14px">
      <input type="text" id="guess" list="names" placeholder="锁定答案了？输入船名…" style="flex:1;min-width:200px">
      <datalist id="names"></datalist>
      <button class="primary" id="guessBtn">我猜是它！</button>
    </div>

    <div class="legend">
      <span style="background:#c084fc">≥90% 神之一问</span>
      <span style="background:#d8b4fe">75-90%</span>
      <span style="background:#7dd3fc">60-75%</span>
      <span style="background:#4ade80">45-60%</span>
      <span style="background:#86efac">30-45%</span>
      <span style="background:#facc15">20-30%</span>
      <span style="background:#fb923c">10-20%</span>
      <span style="background:#ef4444;color:#fff"><10% 刮痧</span>
    </div>

    <details><summary>💡 没思路？看智能推荐数值</summary><div id="rec" style="margin-top:6px;font-size:13px"></div></details>
    <details><summary>查看候选名单（<span id="candN">0</span>）</summary><div id="cands"></div></details>

    <div style="margin-top:10px" id="log"></div>
    <div class="row" style="margin-top:10px">
      <button id="revealBtn">认输看答案</button>
      <button id="againBtn">再来一局</button>
    </div>
    <div id="result"></div>
  </div>
</div>

ier":11,"sp":"战列舰","na":"美国","hp":115100.0,"con":14.26,"spd":30.4,"guns":16.0,"cal":406.0,"rel":35.0,"fir":36.0,"sig":1.7,"tub":0,"hyd":0.0,"rad":0.0,"rng":24.2,"smk":"无烟"},{"n":"乌沙科夫","tier":11,"sp":"战列舰","na":"苏联","hp":135300.0,"con":14.4,"spd":30.0,"guns":9.0,"cal":457.0,"rel":33.0,"fir":45.0,"sig":1.8,"tub":0,"hyd":0.0,"rad":0.0,"rng":21.3,"smk":"无烟"},{"n":"毁灭","tier":11,"sp":"战列舰","na":"英国","hp":99800.0,"con":13.11,"spd":30.5,"guns":16.0,"cal":419.0,"rel":38.0,"fir":48.0,"sig":1.7,"tub":0,"hyd":0.0,"rad":0.0,"rng":24.5,"smk":"无烟"},{"n":"山雾","tier":11,"sp":"驱逐舰","na":"日本","hp":22200.0,"con":5.59,"spd":39.5,"guns":6.0,"cal":127.0,"rel":4.5,"fir":9.0,"sig":2.0,"tub":18.0,"hyd":0.0,"rad":0.0,"rng":12.1,"smk":"普通烟"},{"n":"达拉纳","tier":11,"sp":"驱逐舰","na":"欧洲","hp":20300.0,"con":6.08,"spd":36.0,"guns":6.0,"cal":120.0,"rel":2.8,"fir":8.0,"sig":2.0,"tub":10.0,"hyd":0.0,"rad":0.0,"rng":11.2,"smk":"无烟"},{"n":"昆明","tier":11,"sp":"驱逐舰","na":"泛亚","hp":20200.0,"con":6.0,"spd":38.0,"guns":8.0,"cal":127.0,"rel":5.0,"fir":5.0,"sig":2.0,"tub":15.0,"hyd":0.0,"rad":7.5,"rng":13.4,"smk":"普通烟"},{"n":"约书亚·汉弗莱斯","tier":11,"sp":"驱逐舰","na":"美国","hp":23700.0,"con":5.93,"spd":37.2,"guns":6.0,"cal":127.0,"rel":2.7,"fir":5.0,"sig":2.0,"tub":10.0,"hyd":0.0,"rad":0.0,"rng":12.1,"smk":"普通烟"},{"n":"佐尔基","tier":11,"sp":"驱逐舰","na":"苏联","hp":23600.0,"con":7.86,"spd":43.0,"guns":8.0,"cal":130.0,"rel":5.3,"fir":10.0,"sig":2.0,"tub":10.0,"hyd":0.0,"rad":0.0,"rng":12.3,"smk":"普通烟"}];
const MAXQ = 20;
const ATTRS = [
  {k:"tier", name:"等级",     unit:"级",   step:1},
  {k:"hp",   name:"血量",     unit:"",     step:1000},
  {k:"con",  name:"水面隐蔽", unit:"km",   step:0.5},
  {k:"spd",  name:"航速",     unit:"节",   step:0.5},
  {k:"guns", name:"主炮数",   unit:"门",   step:1},
  {k:"cal",  name:"口径",     unit:"mm",   step:1},
  {k:"rel",  name:"装填",     unit:"秒",   step:1},
  {k:"fir",  name:"点火率",   unit:"%",    step:1},
  {k:"sig",  name:"Sigma",    unit:"",     step:0.05},
  {k:"tub",  name:"鱼雷管数", unit:"",     step:1},
  {k:"hyd",  name:"水听",     unit:"km",   step:0.5},
  {k:"rad",  name:"雷达",     unit:"km",   step:0.5},
];

let secret=null, cands=[], used=0, over=false, curAttr="hp";
let ranges={}; // k -> {lo,hi} 当前已知区间（左闭右闭，含等于端点知识）

function log(html,color){const d=document.createElement("div");if(color)d.style.color=color;d.innerHTML=html;document.getElementById("log").prepend(d);}
function fmt(v){ if(v==null) return "-"; const n=Number(v); return Math.abs(n%1)<1e-9 ? n.toLocaleString() : n; }
function tierColor(pct){
  if(pct>=90) return ["#c084fc","神之一问"];
  if(pct>=75) return ["#d8b4fe","极高"];
  if(pct>=60) return ["#7dd3fc","高"];
  if(pct>=45) return ["#4ade80","中高"];
  if(pct>=30) return ["#86efac","中"];
  if(pct>=20) return ["#facc15","一般"];
  if(pct>=10) return ["#fb923c","低效"];
  return ["#ef4444","刮痧"];
}

function buildAttrButtons(){
  const box=document.getElementById("attrs"); box.innerHTML="";
  for(const a of ATTRS){
    const b=document.createElement("button");
    b.className="attr"+(a.k===curAttr?" on":"");
    b.id="attr_"+a.k;
    b.innerHTML=`<b>${a.name}</b><small id="rng_${a.k}">—</small>`;
    b.onclick=()=>{curAttr=a.k; buildAttrButtons();
      document.getElementById("qAttr").textContent=a.name;
      document.getElementById("qUnit").textContent=a.unit;};
    box.appendChild(b);
  }
  document.getElementById("qAttr").textContent=ATTRS.find(a=>a.k===curAttr).name;
  document.getElementById("qUnit").textContent=ATTRS.find(a=>a.k===curAttr).unit;
}
function updateRanges(){
  for(const a of ATTRS){
    const el=document.getElementById("rng_"+a.k); if(!el) continue;
    const r=ranges[a.k];
    el.textContent = r ? `[${fmt(r.lo)} ~ ${fmt(r.hi)}]` : "—";
  }
}
function setStat(){
  document.getElementById("left").textContent=cands.length;
  document.getElementById("used").textContent=used+" / "+MAXQ;
  document.getElementById("floor").textContent=Math.max(0,Math.ceil(Math.log2(Math.max(cands.length,1))));
  document.getElementById("candN").textContent=cands.length;
  document.getElementById("cands").innerHTML=cands.slice(0,150).map(s=>`<span>T${s.tier} ${s.n}</span>`).join("")+(cands.length>150?`<span>…共${cands.length}艘</span>`:"");
  updateRanges(); recommend();
}
function recommend(){
  // 对每个属性，给出中位数值与预期劈分
  const out=[];
  for(const a of ATTRS){
    const vals=cands.map(s=>s[a.k]).filter(v=>v!=null).sort((x,y)=>x-y);
    if(!vals.length) continue;
    const med=vals[Math.floor(vals.length/2)];
    const hi=cands.filter(s=>s[a.k]!=null&&s[a.k]>med).length;
    const pct=Math.max(hi, cands.length-hi)/cands.length*100;
    out.push({a,med,pct});
  }
  out.sort((x,y)=>x.pct-y.pct);
  document.getElementById("rec").innerHTML=out.slice(0,5).map(o=>{
    const lo=ranges[o.a.k]?ranges[o.a.k].lo:null, hi=ranges[o.a.k]?ranges[o.a.k].hi:null;
    if(lo!=null&&hi!=null&&Math.abs(hi-lo)<1e-9) return `<div>✅ ${o.a.name} 已锁定 = ${fmt(hi)}</div>`;
    return `<div>试试：${o.a.name} &gt; <b>${fmt(o.med)}</b>（最坏保留 ${o.pct.toFixed(0)}%）</div>`;
  }).join("");
}

function ask(){
  if(over) return;
  const a=ATTRS.find(x=>x.k===curAttr);
  const v=parseFloat(document.getElementById("qVal").value);
  if(isNaN(v)){ log("先输入数值"); return; }
  const sv=secret[a.k];
  if(sv==null){ log("该船此属性无数据，换个属性"); return; }
  used++;
  const before=cands.length;
  let cmp, kept;
  if(Math.abs(sv-v)<1e-9){ cmp="等于"; kept=cands.filter(s=>s[a.k]!=null&&Math.abs(s[a.k]-v)<1e-9); }
  else if(sv>v){ cmp="大于"; kept=cands.filter(s=>s[a.k]!=null&&s[a.k]>v); }
  else { cmp="小于"; kept=cands.filter(s=>s[a.k]!=null&&s[a.k]<v); }
  cands=kept;
  const pct=before>0? Math.round((1-cands.length/before)*100):0;
  const [color,grade]=tierColor(pct);
  log(`问${used}：该战舰 <b>${a.name}</b> <b>${cmp} ${fmt(v)}${a.unit}</b>　<span style="color:${color}">排除 ${pct}%（${grade}）· 剩 ${cands.length} 艘</span>`);
  // 更新已知区间
  const r=ranges[a.k]||(ranges[a.k]={lo:null,hi:null});
  if(cmp==="等于"){ r.lo=sv; r.hi=sv; }
  else if(cmp==="大于"){ r.lo = (r.lo==null? v : Math.max(r.lo, v)); if(r.lo<=v) r.lo=v+ (a.step||1)*0.001; r.lo = Math.max(r.lo==null?-Infinity:r.lo, v); }
  else { r.hi = (r.hi==null? v : Math.min(r.hi, v)); r.hi = Math.min(r.hi==null?Infinity:r.hi, v); }
  // 用候选实际范围收紧显示
  const vals=cands.map(s=>s[a.k]).filter(x=>x!=null);
  if(vals.length){ const mn=Math.min(...vals), mx=Math.max(...vals);
    r.lo = r.lo==null? mn : Math.max(r.lo, mn);
    r.hi = r.hi==null? mx : Math.min(r.hi, mx);
  }
  document.getElementById("qVal").value="";
  setStat();
  if(used>=MAXQ && cands.length>1) end(false,"20 问用完");
}
function doGuess(){
  if(over) return;
  const v=document.getElementById("guess").value.trim();
  if(!v) return;
  log(`✍ 你猜：<b>${v}</b>`);
  if(v===secret.n){ end(true); }
  else { log(`<span style="color:#f87171">不对（不耗问题数）</span>`); document.getElementById("guess").value=""; }
}
function shipCardHTML(s){
  return `<b>${s.n}</b>（${s.na} · T${s.tier} ${s.sp}）<br>血量 ${fmt(s.hp)} · 隐蔽 ${s.con}km · 航速 ${s.spd}节 · ${s.guns!=null?Math.round(s.guns):"-"}门${s.cal!=null?Math.round(s.cal):"-"}mm · 装填${s.rel??"-"}s · Σ${s.sig??"-"} · 点火${s.fir!=null?fmt(s.fir)+"%":"-"} · ${Math.round(s.tub)}管 · 水听${s.hyd}km · 雷达${s.rad}km · ${s.smk}`;
}
function end(win, note){
  over=true;
  const r=document.getElementById("result"); const s=secret;
  r.innerHTML = win ? `<p class="win">🎉 猜中了！答案就是 ${s.n}</p>`
                    : `<p class="lose">😵 ${note||""}。答案是 ${s.n}</p>`;
  r.innerHTML+=`<div class="shipcard card">📋 ${shipCardHTML(s)}</div>`;
  log(win?`<span style="color:#4ade80">🏆 共用 ${used} 问</span>`:`答案：${s.n}`);
}
function reveal(){ if(!over){ log("🏳 认输"); end(false,"主动认输"); } }

function begin(pool, secretShip, label){
  secret=secretShip; cands=pool.slice(); used=0; over=false; ranges={};
  document.getElementById("result").innerHTML="";
  document.getElementById("log").innerHTML="";
  document.getElementById("game").style.display="block";
  buildAttrButtons(); setStat();
  log(label);
  document.getElementById("game").scrollIntoView({behavior:"smooth"});
}
function start(){
  const [tmin,tmax]=document.getElementById("range").value==="custom"
    ? [+document.getElementById("tmin").value||5, +document.getElementById("tmax").value||11]
    : document.getElementById("range").value.split("-").map(Number);
  const lo=Math.min(tmin,tmax), hi=Math.max(tmin,tmax);
  const pool=SHIPS.filter(s=>s.tier>=lo&&s.tier<=hi);
  if(!pool.length){ alert("范围内没有船"); return; }
  begin(pool, pool[Math.floor(Math.random()*pool.length)], `🎲 随机开局 · 范围 ${lo}-${hi} 级 · ${pool.length} 艘`);
}

document.getElementById("startBtn").onclick=start;
document.getElementById("againBtn").onclick=start;
document.getElementById("askBtn").onclick=ask;
document.getElementById("guessBtn").onclick=doGuess;
document.getElementById("revealBtn").onclick=reveal;
document.getElementById("qVal").addEventListener("keydown",e=>{if(e.key==="Enter")ask();});
document.getElementById("guess").addEventListener("keydown",e=>{if(e.key==="Enter")doGuess();});
document.getElementById("range").onchange=e=>{document.getElementById("customWrap").style.display=e.target.value==="custom"?"inline":"none";};
document.getElementById("names").innerHTML=SHIPS.map(s=>`<option value="${s.n}">`).join("");
</script>
